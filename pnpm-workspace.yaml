packages:
  - .

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest@*: 5.1.0

allowBuilds:
  '@swc/core': false
  esbuild: true
  unrs-resolver: true

pmOnFail: error

# The Vite+ alias reports its package version; it embeds Vite 8.3.7.
peerDependencyRules:
  allowedVersions:
    vite: 1.6.0

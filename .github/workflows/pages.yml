name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.6.0'
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Mechanics tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  browser:
    name: browser (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.6.0'
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      # --fully-parallel lets Playwright split shards per test instead of per
      # file (there are only two spec files). The config keeps workers: 1, so
      # tests still run one at a time inside a shard; the tests are independent
      # (no serial describes, no shared state), so this is safe.
      - name: Browser smoke tests
        run: pnpm exec playwright test --fully-parallel --shard=${{ matrix.shard }}/5
      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-screenshots-${{ matrix.shard }}
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
